<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff0d9">
<title>解谜大冒险 · 密室逃脱 · 侦探推理 · 关卡益智</title>
<style>
:root{--ink:#4a3560;--ink2:#7d6b91;--pink:#ff6fa5;--pink2:#ffd6e6;--purple:#8e6bff;--purple2:#ebe4ff;--mint:#22b88a;--mint2:#d4f6ea;--sun:#ffc23c;--sun2:#fff1c7;--sky:#4d9bff;--sky2:#dcecff;--coral:#ff7b6b;--card:#fff;--r:20px;--shadow:0 6px 18px rgba(120,80,160,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;color:var(--ink);background:linear-gradient(165deg,#fff0d9 0%,#ffe6f1 45%,#e6f0ff 100%) fixed;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
h1,h2,h3,p{margin:0}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:1040px;margin:0 auto;padding:12px 14px 28px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.btn{border-radius:16px;padding:12px 18px;font-size:17px;font-weight:800;background:#fff;box-shadow:0 4px 0 rgba(74,53,96,.13);transition:transform .08s;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,53,96,.13)}
.btn.primary{background:linear-gradient(180deg,#ff8dba,#ff5d98);color:#fff;box-shadow:0 5px 0 #d94a80}
.btn.purple{background:linear-gradient(180deg,#a68bff,#7f5cff);color:#fff;box-shadow:0 5px 0 #6243d6}
.btn.mint{background:linear-gradient(180deg,#46d6aa,#1fb185);color:#fff;box-shadow:0 5px 0 #188d69}
.btn.sun{background:linear-gradient(180deg,#ffd76a,#ffb820);color:#6b4a00;box-shadow:0 5px 0 #d99500}
.btn.ghost{background:rgba(255,255,255,.75)}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.88);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(74,53,96,.1);font-size:22px;flex:none}
.iconbtn svg{width:24px;height:24px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--purple2);color:#6a4bd8;white-space:nowrap}
.tag.pink{background:var(--pink2);color:#d63e7a}.tag.mint{background:var(--mint2);color:#138a66}.tag.sun{background:var(--sun2);color:#a8740a}
.stars{display:inline-flex;gap:2px;vertical-align:middle}.stars svg{width:18px;height:18px}
/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,246,236,.92);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(120,80,160,.08)}
.topbar .ttl{flex:1;min-width:0;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.hintbtn{height:46px;border-radius:15px;padding:0 12px;background:linear-gradient(180deg,#ffe58a,#ffc93c);box-shadow:0 3px 0 #dba21a;font-weight:900;font-size:16px;display:inline-flex;align-items:center;gap:4px;flex:none}
/* ---------- 首页 ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 4px}
.logo{font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ff5d98,#8e6bff 60%,#4d9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.starpill{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:900;box-shadow:var(--shadow)}
.starpill svg{width:20px;height:20px}
.mascot{display:flex;align-items:center;gap:10px;margin:12px 0}
.mascot .face{font-size:46px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{background:#fff;border-radius:16px;padding:10px 14px;font-size:15px;box-shadow:var(--shadow);position:relative;line-height:1.5}
.games{display:grid;grid-template-columns:1fr;gap:14px}
.game{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border-radius:24px;padding:16px;min-height:118px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.12),var(--shadow);overflow:hidden;width:100%}
.game:active{transform:translateY(3px)}
.game .gi{font-size:52px;flex:none;width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center}
.game h2{font-size:24px;font-weight:900;letter-spacing:1px}
.game p{font-size:14px;opacity:.95;margin-top:4px;line-height:1.45}
.game .prog{margin-top:8px;font-size:13px;font-weight:800;background:rgba(255,255,255,.25);display:inline-block;padding:3px 10px;border-radius:999px}
.game.g1{background:linear-gradient(135deg,#ff9a6b,#ff5d98)}
.game.g2{background:linear-gradient(135deg,#7f8cff,#8e5cff)}
.game.g3{background:linear-gradient(135deg,#2fd1a0,#24a5d6)}
.game:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.home-foot{margin-top:16px;text-align:center;color:var(--ink2);font-size:13px;line-height:1.6}
@media(min-width:900px){.games{grid-template-columns:repeat(3,1fr)}.game{flex-direction:column;text-align:center;min-height:260px;justify-content:center}.game .gi{width:96px;height:96px;font-size:62px}}
/* ---------- 关卡列表 ---------- */
.list-intro{margin:12px 2px;color:var(--ink2);font-size:14px;line-height:1.5}
.lv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(min-width:700px){.lv-grid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:1000px){.lv-grid{grid-template-columns:repeat(8,1fr)}}
.lv{background:#fff;border-radius:18px;min-height:78px;padding:8px 4px;box-shadow:0 4px 0 rgba(74,53,96,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:22px;font-weight:900}
.lv.locked{background:#f1ecf5;color:#b9aec6;box-shadow:none}
.lv.cur{outline:3px solid var(--pink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{outline-color:#ffd0e3}}
.lv .stars svg{width:14px;height:14px}
.big-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.big-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.big-grid{grid-template-columns:1fr 1fr 1fr}}
.big{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:12px;box-shadow:0 4px 0 rgba(74,53,96,.1);text-align:left;min-height:84px;width:100%}
.big .bi{font-size:36px;width:60px;height:60px;border-radius:18px;background:var(--sun2);display:flex;align-items:center;justify-content:center;flex:none}
.big b{font-size:18px;display:block}
.big small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.big .r{margin-left:auto;text-align:right;flex:none}
.big.locked{opacity:.55}
.big.locked .bi{filter:grayscale(1)}
.hub .big .bi{background:var(--mint2)}
/* ---------- 底部弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(60,40,80,.38);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fadein .2s}
.sheet{background:#fffaf4;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:26px}}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet-h h3{flex:1;font-size:20px;font-weight:900}
.xbtn{width:42px;height:42px;border-radius:14px;background:#f1e9f7;font-size:20px;font-weight:900;flex:none}
.say{font-size:16px;line-height:1.65}
.note{margin:10px 0;background:#fffdf0;border:2px dashed #e6cf8a;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.75;white-space:pre-line;color:#5b4636}
.banner{background:var(--mint2);color:#11795a;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px;margin-bottom:10px;line-height:1.5}
.banner.bad{background:#ffe3df;color:#c0392b}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1;min-width:120px}
/* 密码锁 */
.lock{margin-top:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:inset 0 0 0 2px #f0e6f7}
.lock-p{font-size:14px;color:var(--ink2);font-weight:700;text-align:center;margin-bottom:8px}
.codebox{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.codebox span{width:46px;height:54px;border-radius:12px;background:#f6f1fb;border:3px solid #e2d6f0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--ink)}
.codebox span.f{border-color:var(--purple);background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
.pad button,.kb button{background:#f6f1fb;border-radius:14px;min-height:50px;font-size:22px;font-weight:900;box-shadow:0 3px 0 #e2d6f0}
.pad button:active,.kb button:active{transform:translateY(2px);box-shadow:none}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px;margin:0 auto}
.kb button{min-height:46px;font-size:19px}
.dials{display:flex;justify-content:center;gap:16px}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial .ch{width:68px;height:72px;border-radius:16px;background:#fff7e0;border:3px solid #f1c75b;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;font-family:"Noto Serif CJK SC","Songti SC",serif}
.dial button{width:68px;height:44px;border-radius:12px;background:#f6f1fb;font-size:20px;box-shadow:0 3px 0 #e2d6f0}
.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.choices button{width:66px;height:66px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);border:3px solid rgba(255,255,255,.7)}
.lock .ok{width:100%;margin-top:10px}
/* ---------- 密室 ---------- */
.room-wrap{max-width:1040px;margin:0 auto;padding:10px 12px 24px;display:grid;gap:10px}
@media(min-width:900px){.room-wrap{grid-template-columns:1.7fr 1fr;align-items:start}}
.scene-box{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;line-height:0;position:relative}
#scene{width:100%;height:auto;display:block;aspect-ratio:4/3}
#scene .obj,#scene .hit{cursor:pointer}
#scene .obj:hover{filter:brightness(1.06)}
#scene .hl{fill:none;stroke:#ffcf00;stroke-width:4;stroke-dasharray:8 6;animation:dash 1s linear infinite;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-28}}
.msg{background:#fff;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:var(--shadow);min-height:52px}
.inv-h{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:15px;margin:2px 4px}
.inv-h small{font-weight:700;color:var(--ink2);font-size:12px}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{background:rgba(255,255,255,.75);border-radius:14px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid transparent;padding:4px 2px;box-shadow:0 3px 0 rgba(74,53,96,.08)}
.slot .ic{font-size:28px;line-height:1.1}
.slot .nm{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.empty{background:rgba(255,255,255,.35);box-shadow:none}
.slot.sel{border-color:var(--pink);background:#fff1f7;transform:translateY(-3px)}
.slot.glow .ic{filter:drop-shadow(0 0 6px #ffd23f)}
.side{display:flex;flex-direction:column;gap:10px}
.room-tools{display:flex;gap:8px}
.room-tools .btn{flex:1;font-size:15px;min-height:44px;padding:8px}
/* ---------- 侦探 ---------- */
.tabs{display:flex;gap:6px;padding:8px 12px 0;max-width:1040px;margin:0 auto;position:sticky;top:66px;z-index:15}
.tabs button{flex:1;background:rgba(255,255,255,.7);border-radius:14px 14px 0 0;min-height:46px;font-weight:900;font-size:15px;position:relative}
.tabs button.on{background:#fff;color:#6a4bd8}
.tabs button .dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--pink)}
.case-body{max-width:1040px;margin:0 auto;padding:0 12px 24px}
.pane{display:none;background:#fff;border-radius:0 0 20px 20px;padding:14px;box-shadow:var(--shadow)}
.pane.on{display:block}
.pane h3{font-size:17px;font-weight:900;margin:4px 0 10px;display:flex;align-items:center;gap:6px}
@media(min-width:900px){.tabs{display:none}.case-body{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:12px}.pane{display:block;border-radius:20px}.pane+.pane{margin-top:0}.case-col{display:flex;flex-direction:column;gap:14px}}
.story p{font-size:16px;line-height:1.75;margin-bottom:6px}
.sus{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.sus .av{font-size:34px;width:52px;height:52px;border-radius:16px;background:var(--sun2);display:flex;align-items:center;justify-content:center;flex:none}
.sus .sb{background:#f6f1fb;border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:15px;line-height:1.55;flex:1}
.sus .sb b{display:block;font-size:13px;color:#6a4bd8}
.clues{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.clues{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.clues{grid-template-columns:1fr}}
.clue{text-align:left;border-radius:16px;padding:12px;min-height:78px;background:linear-gradient(135deg,#a68bff,#7f5cff);color:#fff;box-shadow:0 4px 0 #6243d6;display:flex;gap:10px;align-items:center;width:100%}
.clue .ci{font-size:30px;flex:none;width:46px;text-align:center}
.clue.open{background:#fffdf0;color:var(--ink);box-shadow:0 0 0 2px #f1dc9a inset;align-items:flex-start}
.clue b{display:block;font-size:16px}
.clue .ct{font-size:15px;line-height:1.6;margin-top:4px}
.clue table{border-collapse:collapse;margin-top:6px;font-size:14px}
.clue td{border:1.5px solid #e6cf8a;padding:4px 10px;text-align:center}
.clue tr:first-child td{background:#fff3c4;font-weight:800}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ngrid{border-collapse:separate;border-spacing:3px;width:100%}
.ngrid th{font-size:13px;font-weight:800;color:var(--ink2);padding:2px;vertical-align:bottom;line-height:1.3}
.ngrid th.rh{text-align:left;font-size:14px;color:var(--ink);white-space:nowrap}
.ngrid th.rh.fmt{white-space:normal;min-width:4.5em}
.ngrid th.rh button{display:flex;align-items:center;gap:4px;font-weight:900;font-size:14px;padding:4px;border-radius:10px;min-height:44px}
.ngrid th.rh.out button{text-decoration:line-through;opacity:.45}
.ngrid td button{width:100%;min-width:34px;height:46px;border-radius:12px;background:#f6f1fb;font-size:22px;font-weight:900}
.ngrid td button.y{background:var(--mint2);color:#11795a}
.ngrid td button.n{background:#ffe3df;color:#d0453a}
.gnote{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.5}
.ask{font-size:18px;font-weight:900;margin-bottom:10px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick button{background:#fff7e0;border-radius:18px;padding:10px 4px;min-height:92px;box-shadow:0 4px 0 #f1c75b;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:15px}
.pick button .av{font-size:36px}
.pick button.on{background:#ffe0ec;box-shadow:0 4px 0 #ff8db8}
.reasons{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.reasons button{text-align:left;background:#f6f1fb;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.55;min-height:56px;box-shadow:0 3px 0 #e2d6f0}
/* ---------- 益智：通用 ---------- */
.pz-wrap{max-width:720px;margin:0 auto;padding:10px 12px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.pz-stat{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:14px;font-weight:800}
.pz-stat span{background:#fff;border-radius:999px;padding:6px 12px;box-shadow:0 2px 0 rgba(74,53,96,.08)}
.pz-tip{font-size:14px;color:var(--ink2);text-align:center;line-height:1.5;min-height:21px;max-width:520px}
.pz-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pz-btns .btn{min-width:104px}
/* 推箱子 */
.soko{position:relative;touch-action:none}
.soko .c{position:absolute}
.soko .wall{background:#b98a5e;border-radius:6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),inset 0 0 0 2px #a5784e}
.soko .floor{background:#fff6ea;border-radius:4px}
.soko .goal:after{content:"";position:absolute;inset:30%;border-radius:50%;background:#ffcf4d;box-shadow:0 0 0 4px rgba(255,207,77,.35)}
.soko .box,.soko .pl{transition:left .12s ease,top .12s ease;display:flex;align-items:center;justify-content:center}
.soko .box{border-radius:8px;background:linear-gradient(45deg,transparent 46%,#8a5428 46%,#8a5428 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#8a5428 46%,#8a5428 54%,transparent 54%),#d79a5a;box-shadow:inset 0 0 0 3px #8a5428,0 3px 0 rgba(0,0,0,.15)}
.soko .box.on{background:linear-gradient(45deg,transparent 46%,#1d8f68 46%,#1d8f68 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#1d8f68 46%,#1d8f68 54%,transparent 54%),#58d6a6;box-shadow:inset 0 0 0 3px #1d8f68,0 0 10px #8ef0c8}
.soko .box.hl{outline:4px dashed #ff5d98;outline-offset:2px;animation:pulse 1s infinite}
.soko .pl{z-index:3;line-height:1}
.soko .arrow{position:absolute;z-index:4;display:flex;align-items:center;justify-content:center;color:#ff3d7f;font-weight:900;pointer-events:none;text-shadow:0 0 4px #fff,0 0 8px #fff}
.soko .spot{position:absolute;border:3px dashed #ff5d98;border-radius:10px;z-index:2;pointer-events:none}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px}
.dpad button{background:#fff;border-radius:16px;font-size:24px;box-shadow:0 4px 0 rgba(74,53,96,.13)}
.dpad button:active{transform:translateY(3px);box-shadow:none}
.dpad .u{grid-column:2}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.soko-ctl{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
/* 华容道 */
.hrd{position:relative;margin-bottom:12px;background:#7a5235;border-radius:18px;padding:8px;box-shadow:var(--shadow),inset 0 0 0 4px #5d3c25;touch-action:none}
.hrd .pc{position:absolute;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#fff;transition:left .14s,top .14s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 0 0 3px rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.hrd .pc .e{font-size:1.6em;line-height:1.1}
.hrd .pc.C{background:linear-gradient(180deg,#ff7a7a,#e04848)}
.hrd .pc.H{background:linear-gradient(180deg,#5fd18f,#2ea866)}
.hrd .pc.V{background:linear-gradient(180deg,#78a8ff,#4d7fe0)}
.hrd .pc.S{background:linear-gradient(180deg,#ffcf6a,#f0a828);color:#6b4a00;text-shadow:none}
.hrd .pc.sel{outline:4px solid #fff;outline-offset:-2px}
.hrd .pc.hl{outline:4px dashed #ff5d98;outline-offset:2px;animation:pulse 1s infinite}

<script>
/*ENGINE-START*/
(function(G){
'use strict';
var E={};
/* ================= 密室逃脱 ================= */
function has(st,i){return st.inv.indexOf(i)>=0;}
function cond(st,c){var neg=c[0]==='!';if(neg)c=c.slice(1);var v=c.indexOf('has:')===0?has(st,c.slice(4)):!!st.flags[c];return neg?!v:v;}
function condAll(st,list){return !list||list.every(function(c){return cond(st,c);});}
var R={
  init:function(){return {flags:{},inv:[],done:false};},
  obj:function(room,id){for(var i=0;i<room.objects.length;i++)if(room.objects[i].id===id)return room.objects[i];return null;},
  view:function(room,st,id){var o=R.obj(room,id);if(!o)return null;for(var i=0;i<o.views.length;i++)if(condAll(st,o.views[i].if))return o.views[i];return null;},
  apply:function(st,eff){(eff.take||[]).forEach(function(i){var k=st.inv.indexOf(i);if(k>=0)st.inv.splice(k,1);});
    (eff.give||[]).forEach(function(i){if(!has(st,i))st.inv.push(i);});(eff.set||[]).forEach(function(f){st.flags[f]=true;});
    if(eff.win){st.done=true;st.flags.escaped=true;}return {ok:true,text:eff.text||'',eff:eff};},
  look:function(room,st,id){var v=R.view(room,st,id);if(!v)return {ok:false,text:''};if(v.set)v.set.forEach(function(f){st.flags[f]=true;});return {ok:true,view:v,text:v.text};},
  take:function(room,st,id){var v=R.view(room,st,id);if(!v||!v.take)return {ok:false,text:'这里没有可以拿的东西。'};return R.apply(st,v.take);},
  norm:function(s){return String(s).toUpperCase().replace(/\s+/g,'');},
  code:function(room,st,id,code){var v=R.view(room,st,id);if(!v||!v.lock)return {ok:false,text:''};
    if(R.norm(code)===R.norm(v.lock.answer))return R.apply(st,v.lock.ok);return {ok:false,bad:true,text:v.lock.bad||'密码不对哦，再想一想。'};},
  use:function(room,st,id,item){if(!has(st,item))return {ok:false,text:''};var v=R.view(room,st,id);
    var u=v&&v.use?v.use.filter(function(x){return x.item===item;})[0]:null;
    if(!u)return {ok:false,text:(v&&v.wrong)||'好像用不上，换个东西试试吧。'};return R.apply(st,u);},
  combine:function(room,st,a,b){if(!has(st,a)||!has(st,b)||a===b)return {ok:false,text:''};
    var c=(room.combos||[]).filter(function(x){return (x.a===a&&x.b===b)||(x.a===b&&x.b===a);})[0];
    if(!c)return {ok:false,text:'这两样东西放在一起，好像没什么用。'};
    return R.apply(st,{take:[a,b],give:c.give,set:c.set,text:c.text});},
  hint:function(room,st){for(var i=0;i<room.hints.length;i++){var h=room.hints[i];if(!st.flags[h.until]&&condAll(st,h.if))return {idx:i,h:h};}return null;}
};
E.room=R;

/* ================= 推箱子 ================= */
// 关卡字符：# 墙；空格 地板；. 目标；$ 箱子；* 箱子在目标上；@ 玩家；+ 玩家在目标上；- 外面
var S={
  parse:function(rows){var H=rows.length,W=0,i,x,y;rows.forEach(function(r){W=Math.max(W,r.length);});
    var L={W:W,H:H,cells:[],goals:[],boxes:[],player:-1};
    for(y=0;y<H;y++)for(x=0;x<W;x++){var c=rows[y][x]||'-';i=y*W+x;L.cells[i]=c==='#'?'#':c==='-'?'-':' ';
      if('.*+'.indexOf(c)>=0)L.goals.push(i);if('$*'.indexOf(c)>=0)L.boxes.push(i);if('@+'.indexOf(c)>=0)L.player=i;}
    // 墙外面的空格（从边缘能走到的）也当作“外面”
    return L;},
  dirs:function(W){return {U:-W,D:W,L:-1,R:1};},
  // 走一步（可能推箱子）；返回新状态或 null
  step:function(L,st,d){var dd=S.dirs(L.W)[d],n=st.p+dd;if(L.cells[n]!==' ')return null;var bi=st.b.indexOf(n);
    if(bi>=0){var t=n+dd;if(L.cells[t]!==' '||st.b.indexOf(t)>=0)return null;var nb=st.b.slice();nb[bi]=t;return {p:n,b:nb,push:true,box:bi};}
    return {p:n,b:st.b.slice(),push:false};},
  solved:function(L,st){return st.b.every(function(b){return L.goals.indexOf(b)>=0;});},
  // 不推箱子能走到的路径（BFS），返回方向串或 null
  walk:function(L,st,to){if(to===st.p)return '';var D=S.dirs(L.W),prev={},q=[st.p];prev[st.p]='';
    while(q.length){var c=q.shift();for(var k in D){var n=c+D[k];if(prev[n]!==undefined||L.cells[n]!==' '||st.b.indexOf(n)>=0)continue;prev[n]=prev[c]+k;if(n===to)return prev[n];q.push(n);}}
    return null;},
  // 按“推”的次数求解（给提示用），返回下一次推：{box,dir,path,pushes}；死局返回 null
  solve:function(L,st,limit){limit=limit||300000;var W=L.W,D=S.dirs(W),N=L.cells.length,goal={};L.goals.forEach(function(g){goal[g]=1;});
    function reach(p,bs){var seen={},q=[p],mn=p;seen[p]=1;while(q.length){var c=q.pop();if(c<mn)mn=c;for(var k in D){var n=c+D[k];if(seen[n]||L.cells[n]!==' '||bs.indexOf(n)>=0)continue;seen[n]=1;q.push(n);}}return {seen:seen,mn:mn};}
    function dead(i){if(goal[i])return false;var u=L.cells[i-W]!==' ',d=L.cells[i+W]!==' ',l=L.cells[i-1]!==' ',r=L.cells[i+1]!==' ';return (u||d)&&(l||r);}
    function key(bs,mn){return bs.slice().sort(function(a,b){return a-b;}).join(',')+'|'+mn;}
    var r0=reach(st.p,st.b),k0=key(st.b,r0.mn),seen={},first={};seen[k0]=1;var fr=[{p:st.p,b:st.b,f:null}],pushes=0,count=1;
    if(S.solved(L,st))return {done:true};
    while(fr.length){var nx=[];pushes++;
      for(var s=0;s<fr.length;s++){var cur=fr[s],rr=reach(cur.p,cur.b);
        for(var bi=0;bi<cur.b.length;bi++){var b=cur.b[bi];for(var k in D){var from=b-D[k],to=b+D[k];
          if(!rr.seen[from]||L.cells[to]!==' '||cur.b.indexOf(to)>=0||dead(to))continue;
          var nb=cur.b.slice();nb[bi]=to;var r2=reach(b,nb),kk=key(nb,r2.mn);if(seen[kk])continue;seen[kk]=1;count++;
          var f=cur.f||{box:bi,dir:k,from:from};
          if(nb.every(function(x){return goal[x];}))return {box:f.box,dir:f.dir,from:f.from,pushes:pushes};
          if(count>limit)return {limit:true};nx.push({p:b,b:nb,f:f});}}}
      fr=nx;}
    return null;},
  stars:function(moves,par,hints){var s=hints<=0?3:hints===1?2:1;if(moves>par*2&&s>2)s=2;return s;}
};
E.soko=S;

/* ================= 华容道 ================= */
// 棋盘 4 列 × 5 行；C=曹操(2×2)，E=关羽(横 2×1)，A/B/D/F=竖将(1×2)，G/H/I/J=兵(1×1)
var K={
  NAMES:{C:'曹操',E:'关羽',A:'张飞',B:'赵云',D:'马超',F:'黄忠',G:'兵',H:'兵',I:'兵',J:'兵'},
  parse:function(rows){var cells={},x,y;for(y=0;y<5;y++)for(x=0;x<4;x++){var c=rows[y][x];if(c!=='.')(cells[c]=cells[c]||[]).push([x,y]);}
    return Object.keys(cells).map(function(id){var cs=cells[id],xs=cs.map(function(c){return c[0];}),ys=cs.map(function(c){return c[1];});
      var x0=Math.min.apply(null,xs),y0=Math.min.apply(null,ys);return {id:id,x:x0,y:y0,w:Math.max.apply(null,xs)-x0+1,h:Math.max.apply(null,ys)-y0+1};});},
  occ:function(ps){var o=[];for(var i=0;i<20;i++)o.push(-1);ps.forEach(function(p,k){for(var dy=0;dy<p.h;dy++)for(var dx=0;dx<p.w;dx++)o[(p.y+dy)*4+p.x+dx]=k;});return o;},
  DIR:{U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},
  canMove:function(ps,k,d){var p=ps[k],v=K.DIR[d],x=p.x+v[0],y=p.y+v[1];if(x<0||y<0||x+p.w>4||y+p.h>5)return false;var o=K.occ(ps);
    for(var dy=0;dy<p.h;dy++)for(var dx=0;dx<p.w;dx++){var c=o[(y+dy)*4+x+dx];if(c!==-1&&c!==k)return false;}return true;},
  move:function(ps,k,d){var v=K.DIR[d];var n=ps.map(function(p){return {id:p.id,x:p.x,y:p.y,w:p.w,h:p.h};});n[k].x+=v[0];n[k].y+=v[1];return n;},
  won:function(ps){return ps.some(function(p){return p.id==='C'&&p.x===1&&p.y===3;});},
  key:function(ps){var o=[];for(var i=0;i<20;i++)o.push('.');ps.forEach(function(p){var t=p.id==='C'?'c':p.w===2?'h':p.h===2?'v':'s';for(var dy=0;dy<p.h;dy++)for(var dx=0;dx<p.w;dx++)o[(p.y+dy)*4+p.x+dx]=t;});return o.join('');},

function sokoTap(cell){if(SP.done)return;var L=SP.L,st=SP.st,W=L.W,dd={U:-W,D:W,L:-1,R:1};

  var path=E.soko.walk(L,st,cell);if(path===null){if(st.b.indexOf(cell)>=0)toast('走到箱子旁边，再朝它的方向走，就能推它。');return;}
  var k=0;clearInterval(walkTimer);walkTimer=setInterval(function(){if(k>=path.length||SP.done){clearInterval(walkTimer);return;}sokoDo(path[k++],true);SFX.step();},70);}
function sokoUndo(){clearInterval(walkTimer);var h=SP.hist.pop();if(!h){toast('已经是一开始的样子啦');return;}SP.st={p:h.p,b:h.b};SP.moves=h.m;SP.pushes=h.u;SP.hl=null;SP.done=false;SFX.tap();renderSoko();}
function sokoRestart(){clearInterval(walkTimer);var L=SP.L;SP.st={p:L.player,b:L.boxes.slice()};SP.hist=[];SP.moves=0;SP.pushes=0;SP.hl=null;SP.done=false;SFX.tap();renderSoko();}
function sokoHint(){hintSheet({texts:SP.hintTexts,max:3,repeat:true,reveal:function(i){SP.hints++;
  if(i===0)return (SP.lv.tip||'')+' 推之前先想好：每个箱子要去哪颗星星？哪些位置一推进去就再也拉不出来（比如墙角）？';
  var r=E.soko.solve(SP.L,SP.st);if(r===null){SP.hl=null;renderSoko();return '现在这样已经推不出来了（有箱子卡住了）。点「撤销」退回几步，或者点「重来」。';}
  if(r.limit){return '先试着把离星星最近的箱子推过去。';}
  if(i===1){SP.hl={box:r.box};renderSoko();return '先推闪烁的这个箱子。想一想，要站在它的哪一边推？';}
  SP.hl={box:r.box,dir:r.dir,from:r.from};renderSoko();return '走到虚线框的位置，朝箭头方向推一下这个箱子。';}});}
function sokoWin(){var st=E.soko.stars(SP.moves,SP.lv.par,SP.hints);
  winSheet({icon:'📦',title:'第 '+(SP.i+1)+' 关 过关！',stars:st,stat:statLine(['用了 '+SP.moves+' 步（最少 '+SP.lv.par+' 步）',SP.hints?'提示 '+SP.hints+' 次':'']),explain:['推箱子要“先想后推”：箱子只能推、不能拉，推进墙角或者贴着墙推到没有星星的地方，就再也推不回来了。','这一关最少 '+SP.lv.par+' 步就能完成'+(SP.moves<=SP.lv.par?'，你找到了最短的走法，真厉害！':'。想挑战更少的步数，可以再玩一次。')]});}

var HP=null;
function startHrd(i){var lv=LV.hrd[i];HP={i:i,lv:lv,ps:E.hrd.parse(lv.rows),hist:[],moves:0,hints:0,hintTexts:[],sel:null,hl:null,done:false};
  $('#hrdTitle').innerHTML='🏯 华容道<small>第 '+(i+1)+' 关 · '+esc(lv.name)+'</small>';$('#hrdTip').textContent=lv.tip;show('hrd');renderHrd();}
function hrdSize(){var aw=Math.min(window.innerWidth-44,520),ah=Math.max(window.innerHeight-(window.innerWidth<700?340:280),260);return Math.max(52,Math.floor(Math.min(aw/4,ah/5,96)));}
function pieceType(p){return p.id==='C'?'C':p.w===2?'H':p.h===2?'V':'S';}
var PE={C:'🐉',E:'🐴',A:'🛡️',B:'🗡️',D:'🏹',F:'⚔️'};
function renderHrd(){var cs=hrdSize(),el=$('#hrd'),pad=8,h='';HP.cs=cs;el.style.width=cs*4+pad*2+'px';el.style.height=cs*5+pad*2+'px';
  h+='<div class="exit" style="left:'+(pad+cs)+'px;width:'+(cs*2)+'px;top:'+(cs*5+pad*2-2)+'px">出 口</div>';
  HP.ps.forEach(function(p,k){var t=pieceType(p),nm=E.hrd.NAMES[p.id];h+='<div class="pc '+t+(HP.sel===k?' sel':'')+(HP.hl&&HP.hl.k===k?' hl':'')+'" data-k="'+k+'" style="left:'+(pad+p.x*cs+3)+'px;top:'+(pad+p.y*cs+3)+'px;width:'+(p.w*cs-6)+'px;height:'+(p.h*cs-6)+'px;font-size:'+Math.round(cs*(t==='C'?0.3:0.24))+'px">'+(t==='S'?'<span class="e">🙂</span>':'<span class="e">'+(PE[p.id]||'')+'</span>')+'<span>'+nm+'</span></div>';});
  // 箭头
  var arrows=[];if(HP.sel!==null&&!HP.done){['U','D','L','R'].forEach(function(d){if(E.hrd.canMove(HP.ps,HP.sel,d))arrows.push([HP.sel,d,false]);});}
  if(HP.hl&&HP.hl.d&&!arrows.some(function(a){return a[0]===HP.hl.k&&a[1]===HP.hl.d;}))arrows.push([HP.hl.k,HP.hl.d,true]);
  arrows.forEach(function(a){var p=HP.ps[a[0]],cx=pad+(p.x+p.w/2)*cs,cy=pad+(p.y+p.h/2)*cs,o={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]}[a[1]];
    var x=cx+o[0]*(p.w*cs/2-10)-23,y=cy+o[1]*(p.h*cs/2-10)-23;var isH=HP.hl&&HP.hl.k===a[0]&&HP.hl.d===a[1];
    h+='<button class="arr'+(isH?' hint':'')+'" data-k="'+a[0]+'" data-dir="'+a[1]+'" style="left:'+x+'px;top:'+y+'px" aria-label="移动">'+{U:'⬆',D:'⬇',L:'⬅',R:'➡'}[a[1]]+'</button>';});
  el.innerHTML=h;$('#hrdMoves').textContent='步数 '+HP.moves;$('#hrdPar').textContent='最少 '+HP.lv.par+' 步';}
function hrdMove(k,d){if(HP.done)return;if(!E.hrd.canMove(HP.ps,k,d)){SFX.bad();return;}HP.hist.push(HP.ps);HP.ps=E.hrd.move(HP.ps,k,d);HP.moves++;SFX.push();
  if(HP.hl&&!(HP.hl.k===k&&HP.hl.d===d))HP.hl=null;else HP.hl=null;
  if(!E.hrd.canMove(HP.ps,k,'U')&&!E.hrd.canMove(HP.ps,k,'D')&&!E.hrd.canMove(HP.ps,k,'L')&&!E.hrd.canMove(HP.ps,k,'R'))HP.sel=null;
  renderHrd();if(E.hrd.won(HP.ps)){HP.done=true;HP.sel=null;renderHrd();var c=$('#hrd .pc.C');if(c){c.style.top=(parseFloat(c.style.top)+HP.cs*0.6)+'px';}setTimeout(hrdWin,500);}}
function hrdTapPiece(k){if(HP.done)return;var ds=['U','D','L','R'].filter(function(d){return E.hrd.canMove(HP.ps,k,d);});
  if(!ds.length){HP.sel=null;SFX.bad();toast(E.hrd.NAMES[HP.ps[k].id]+'现在动不了，四周都被挡住了。');renderHrd();return;}
  if(ds.length===1){HP.sel=k;hrdMove(k,ds[0]);return;}
  HP.sel=HP.sel===k?null:k;SFX.tap();renderHrd();}
function hrdUndo(){var h=HP.hist.pop();if(!h){toast('已经是一开始的样子啦');return;}HP.ps=h;HP.moves--;HP.hl=null;HP.sel=null;HP.done=false;SFX.tap();renderHrd();}
function hrdRestart(){HP.ps=E.hrd.parse(HP.lv.rows);HP.hist=[];HP.moves=0;HP.hl=null;HP.sel=null;HP.done=false;SFX.tap();renderHrd();}
function hrdHint(){hintSheet({texts:HP.hintTexts,max:3,repeat:true,reveal:function(i){HP.hints++;if(i===0)return HP.lv.tip+' 记住：空格是最宝贵的，想办法把空格“搬”到曹操要去的地方。';
  var r=E.hrd.solve(HP.ps);if(!r||r.limit)return '试着先把小兵挪到角落里。';if(r.done)return '曹操已经在出口啦！';
  var nm=E.hrd.NAMES[HP.ps[r.k].id];if(i===1){HP.hl={k:r.k};HP.sel=null;renderHrd();return '下一步动闪烁的「'+nm+'」。往哪边挪呢？';}
  HP.hl={k:r.k,d:r.d};HP.sel=null;renderHrd();return '把「'+nm+'」往'+{U:'上',D:'下',L:'左',R:'右'}[r.d]+'挪一格（点粉色的箭头）。还要 '+r.moves+' 步就能过关。';}});}
function hrdWin(){var st=E.hrd.stars(HP.moves,HP.lv.par,HP.hints);
  winSheet({icon:'🏯',title:'曹操逃出华容道！',stars:st,stat:statLine(['用了 '+HP.moves+' 步（最少 '+HP.lv.par+' 步）',HP.hints?'提示 '+HP.hints+' 次':'']),explain:['华容道的故事来自《三国演义》：曹操兵败逃到华容道，关羽放了他一条生路。','玩华容道的诀窍：空格是最宝贵的，要想办法把空格移到曹操要走的地方；小兵灵活，可以先让它们让路。','这一关最少 '+HP.lv.par+' 步（每次挪动一格算一步）。']});}

/* ================= 移火柴 ================= */
var MP=null;
var SEGR={a:[10,4,36,8],b:[46,10,8,38],c:[46,52,8,38],d:[10,88,36,8],e:[2,52,8,38],f:[2,10,8,38],g:[10,46,36,8],h:[4,46,36,8],v:[18,32,8,36]};
function startMatch(i){var lv=LV.match[i],chars=lv.eq.split('');MP={i:i,lv:lv,chars:chars,sticks:chars.map(function(c){return E.match.sticksOf(c);}),picked:null,placed:null,hints:0,hintTexts:[],hl:null,done:false};
  $('#mtTitle').innerHTML='🔥 移火柴<small>第 '+(i+1)+' 关</small>';$('#mtTip').textContent='现在的算式：'+pretty(lv.eq)+'　（不对哦！）';show('match');renderMatch();}
function pretty(eq){return eq.replace(/-/g,' − ').replace(/\+/g,' + ').replace(/=/g,' = ');}
function charW(c){return c==='+'||c==='-'||c==='='?44:56;}
function renderMatch(){var x=6,h='',xs=[];MP.chars.forEach(function(c,k){xs.push(x);var nx=MP.chars[k+1];x+=charW(c)+(/\d/.test(c)&&nx&&/\d/.test(nx)?4:12);});var W=x-6;
  var svg=$('#mtSvg');svg.setAttribute('viewBox','0 -6 '+W+' 112');svg.classList.toggle('picking',!!MP.picked&&!MP.placed);
  MP.chars.forEach(function(c,i){var ox=xs[i];
    if(c==='='){[36,56].forEach(function(y){h+=stickSvg(ox+4,y,36,8,false,'');});return;}
    var slots=E.match.slotsOf(c);slots.forEach(function(s){var r=SEGR[s],has=MP.sticks[i].indexOf(s)>=0,pk=MP.picked&&MP.picked[0]===i&&MP.picked[1]===s;
      var hlF=MP.hl&&MP.hl.from&&MP.hl.from[0]===i&&MP.hl.from[1]===s,hlT=MP.hl&&MP.hl.to&&MP.hl.to[0]===i&&MP.hl.to[1]===s;
      if(has)h+='<g class="st'+(pk?' picked':'')+(hlF?' hl':'')+'" data-i="'+i+'" data-s="'+s+'"'+(pk?' transform="translate(0,-5)"':'')+'>'+stickSvg(ox+r[0],r[1],r[2],r[3],true,'')+'<rect x="'+(ox+r[0]-6)+'" y="'+(r[1]-6)+'" width="'+(r[2]+12)+'" height="'+(r[3]+12)+'" fill="transparent"/></g>';
      else h+='<rect class="ghost'+(hlT?' hl':'')+'" data-i="'+i+'" data-s="'+s+'" x="'+(ox+r[0]-2)+'" y="'+(r[1]-2)+'" width="'+(r[2]+4)+'" height="'+(r[3]+4)+'" rx="4"/>';});});
  svg.innerHTML=h;}
function stickSvg(x,y,w,hh,live){var horiz=w>hh;var head=horiz?'<circle cx="'+(x+4)+'" cy="'+(y+hh/2)+'" r="5" fill="#e8463a"/>':'<circle cx="'+(x+w/2)+'" cy="'+(y+4)+'" r="5" fill="#e8463a"/>';
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="4" fill="'+(live?'#f4d29c':'#e9dcc2')+'" stroke="#c99a55" stroke-width="1.5"/>'+head;}
function matchTap(t){if(MP.done)return;var g=t.closest('.st'),gh=t.closest('.ghost');
  if(g){if(MP.placed){SFX.bad();toast('已经移动过一根啦。不对的话，点「放回去」再试。');return;}var i=+g.dataset.i,s=g.dataset.s;
    if(MP.picked&&MP.picked[0]===i&&MP.picked[1]===s){MP.picked=null;SFX.tap();}else{MP.picked=[i,s];SFX.pick();}renderMatch();return;}
  if(gh&&MP.picked&&!MP.placed){var j=+gh.dataset.i,ts=gh.dataset.s,f=MP.picked;
    MP.sticks[f[0]]=MP.sticks[f[0]].filter(function(x){return x!==f[1];});MP.sticks[j]=MP.sticks[j].concat([ts]);MP.placed={from:f,to:[j,ts]};MP.picked=null;renderMatch();
    var eq=E.match.decode(MP.chars,MP.sticks);
    if(eq&&E.match.isTrue(eq)){MP.done=true;MP.result=eq;SFX.ok();$('#mtTip').textContent='等式成立啦：'+pretty(eq)+' ✔';setTimeout(matchWin,700);}
    else{SFX.bad();shake($('.mt-box'));$('#mtTip').textContent=eq?('变成了 '+pretty(eq)+'，等式还不成立哦。点「放回去」再试试。'):'这样摆，有的数字或符号认不出来了。点「放回去」再试试。';}}}
function matchUndo(){if(!MP.placed){if(MP.picked){MP.picked=null;renderMatch();}return;}var p=MP.placed;MP.sticks[p.to[0]]=MP.sticks[p.to[0]].filter(function(x){return x!==p.to[1];});MP.sticks[p.from[0]]=MP.sticks[p.from[0]].concat([p.from[1]]);MP.placed=null;MP.done=false;SFX.tap();
  $('#mtTip').textContent='现在的算式：'+pretty(MP.lv.eq)+'　（不对哦！）';renderMatch();}
function matchHint(){hintSheet({texts:MP.hintTexts,max:3,reveal:function(i){MP.hints++;var s=MP.lv.sol;if(MP.placed&&i>0)matchUndo();
  if(i===0)return MP.lv.tip+' 小窍门：数一数每个数字用了几根火柴，想想拿走一根、加上一根会变成什么数字。';
  if(i===1){MP.hl={from:s.from};renderMatch();return '试试拿起闪着粉色边的这根火柴。';}
  MP.hl={from:s.from,to:s.to};renderMatch();return '把粉色边的火柴，放到发黄光的虚线位置，算式就变成 '+pretty(s.eq)+'。';}});}
function matchWin(){var st=E.starsByHints(MP.hints),lv=MP.lv;
  winSheet({icon:'🔥',title:'等式成立！',stars:st,stat:statLine([pretty(lv.eq)+'  ➜  '+pretty(MP.result),MP.hints?'提示 '+MP.hints+' 次':'']),explain:['原来的算式 '+pretty(lv.eq)+' 是错的。','移动一根火柴后变成 '+pretty(MP.result)+'，左右两边相等。'+(lv.count>1?'这一关一共有 '+lv.count+' 种移法，你找到了其中一种！':''),'火柴棒数字的秘密：6、9、0 都用 6 根，2、3、5 都用 5 根；加号拿走竖着的一根就变成减号。']});}

/* ================= 一笔画 ================= */
var LP=null;
function startLine(i){var lv=LV.line[i];LP={i:i,lv:lv,path:[],used:lv.edges.map(function(){return false;}),hist:[],hints:0,hintTexts:[],hl:null,done:false};
  $('#lnTitle').innerHTML='✏️ 一笔画<small>第 '+(i+1)+' 关 · '+esc(lv.name)+'</small>';show('line');renderLine();}
function renderLine(){var lv=LP.lv,h='',cur=LP.path.length?LP.path[LP.path.length-1]:null;
  lv.edges.forEach(function(e,k){var a=lv.nodes[e[0]],b=lv.nodes[e[1]];var hl=LP.hl&&LP.hl.edge===k;
    h+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+(LP.used[k]?'#ff5d98':hl?'#ffc23c':'#d9d0e6')+'" stroke-width="'+(LP.used[k]?5:hl?5:4)+'" stroke-linecap="round"'+(hl&&!LP.used[k]?' stroke-dasharray="4 3"':'')+'/>';});
  lv.nodes.forEach(function(p,k){var isCur=k===cur,hl=LP.hl&&LP.hl.nodes&&LP.hl.nodes.indexOf(k)>=0,isStart=LP.path[0]===k;
    if(hl)h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8.5" fill="none" stroke="#ffc23c" stroke-width="2.2" stroke-dasharray="3 2"/>';
    h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(isCur?5.5:4.2)+'" fill="'+(isCur?'#ff5d98':isStart?'#ffd0e3':'#fff')+'" stroke="'+(isCur?'#d94a80':'#8e6bff')+'" stroke-width="1.8"/>';
    h+='<circle class="nd" data-n="'+k+'" cx="'+p[0]+'" cy="'+p[1]+'" r="11" fill="transparent" style="cursor:pointer"/>';});
  $('#lnSvg').innerHTML=h;var left=LP.used.filter(function(x){return !x;}).length;
  $('#lnTip').textContent=LP.done?'全部画完啦！':LP.path.length?'还剩 '+left+' 条线没画。':'先点一个点作为起点。';}
function lineTap(n){if(LP.done)return;var lv=LP.lv;if(!LP.path.length){LP.path.push(n);LP.hist.push(-1);SFX.tap();LP.hl=null;renderLine();return;}
  var cur=LP.path[LP.path.length-1];if(n===cur)return;
  var k=-1;lv.edges.forEach(function(e,i){if(k<0&&!LP.used[i]&&((e[0]===cur&&e[1]===n)||(e[1]===cur&&e[0]===n)))k=i;});
  if(k<0){SFX.bad();var was=lv.edges.some(function(e){return (e[0]===cur&&e[1]===n)||(e[1]===cur&&e[0]===n);});toast(was?'这条线已经画过了，每条线只能画一次哦。':'这两个点之间没有线，要沿着线走。');return;}
  LP.used[k]=true;LP.path.push(n);LP.hist.push(k);LP.hl=null;SFX.step();renderLine();
  if(LP.used.every(Boolean)){LP.done=true;SFX.ok();renderLine();setTimeout(lineWin,600);return;}
  var any=lv.edges.some(function(e,i){return !LP.used[i]&&(e[0]===n||e[1]===n);});if(!any){SFX.bad();$('#lnTip').textContent='走到这里没有路了，可还有线没画完。点「撤销」或「重来」再试试！';}}
function lineUndo(){var k=LP.hist.pop();if(k===undefined){toast('还没开始画呢');return;}if(k>=0)LP.used[k]=false;LP.path.pop();LP.done=false;LP.hl=null;SFX.tap();renderLine();}
function lineRestart(){LP.path=[];LP.used=LP.lv.edges.map(function(){return false;});LP.hist=[];LP.hl=null;LP.done=false;SFX.tap();renderLine();}
function lineHint(){hintSheet({texts:LP.hintTexts,max:3,repeat:true,reveal:function(i){LP.hints++;var lv=LP.lv,odd=E.line.odd(lv);
  if(i===0)return '数一数每个点连着几条线。连着单数条线（1、3、5 条）的点叫“奇点”：如果有 2 个奇点，就必须从其中一个出发，到另一个结束。';
  if(i===1){LP.hl={nodes:odd.length?odd:lv.nodes.map(function(_,k){return k;})};renderLine();return odd.length?'这张图有 2 个奇点（黄圈标出来了），从其中一个开始画！':'这张图没有奇点，从哪个点开始都可以，最后会回到起点。';}
  var cur=LP.path.length?LP.path[LP.path.length-1]:null,nx=E.line.next(lv,LP.used,cur);
  if(!nx){if(LP.path.length){return '从现在的位置已经画不完了。点「撤销」退几步，或者「重来」。';}return '';}
  if(cur===null){LP.hl={nodes:[nx.from],edge:nx.edge};renderLine();return '从黄圈的点出发，先画虚线这条。';}
  LP.hl={nodes:[nx.to],edge:nx.edge};renderLine();return '下一步沿着虚线，走到黄圈的点。';}});}
function lineWin(){var st=E.starsByHints(LP.hints),odd=E.line.odd(LP.lv);
  winSheet({icon:'✏️',title:'一笔画成功！',stars:st,stat:statLine(['「'+LP.lv.name+'」一共 '+LP.lv.edges.length+' 条线',LP.hints?'提示 '+LP.hints+' 次':'']),explain:['一笔画的秘密（数学家欧拉发现的）：连着单数条线的点叫“奇点”。','奇点有 0 个：从哪里出发都能一笔画完，而且会回到起点；奇点有 2 个：必须从一个奇点出发，在另一个奇点结束；奇点更多：就画不成一笔了。','这张图有 '+odd.length+' 个奇点'+(odd.length?'，所以要从奇点出发。':'，从哪个点开始都可以。')]});}

/* ================= 事件 ================= */
document.addEventListener('click',function(ev){var t=ev.target;
  if(t.id==='mask'){if(!sheetLocked)closeSheet();return;}
  if(nav.screen==='room'){var ob=t.closest('#scene [data-obj]');if(ob){roomTapObj(ob.getAttribute('data-obj'));return;}}
  if(t.closest('#mtSvg')){matchTap(t);return;}
  var nd=t.closest('#lnSvg .nd');if(nd){lineTap(+nd.dataset.n);return;}
  var dp=t.closest('.dpad [data-dir]');if(dp){sokoDo(dp.dataset.dir);return;}
  var tb=t.closest('#caseTabs [data-tab]');if(tb){SFX.tap();setTab(tb.dataset.tab);return;}
  var b=t.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  switch(a){
    case 'mute':store.sound=!store.sound;save();paintMute();if(store.sound)SFX.tap();break;
    case 'home':SFX.tap();closeSheet(true);renderHome();break;
    case 'hub':SFX.tap();renderHub();break;
    case 'list':SFX.tap();renderList(b.dataset.kind);break;
    case 'back':SFX.tap();closeSheet(true);clearInterval(walkTimer);if(nav.screen==='list'){if(KINDS[nav.kind].pz)renderHub();else renderHome();}else renderList(nav.kind);break;
    case 'play':SFX.tap();play(b.dataset.kind,+b.dataset.i);break;
    case 'close':SFX.tap();closeSheet();break;
    case 'hint':SFX.tap();({room:roomHint,case:caseHint,soko:sokoHint,hrd:hrdHint,match:matchHint,line:lineHint})[nav.screen]();break;
    case 'hintMore':hintMore();break;
    case 'next':closeSheet(true);play(nav.kind,nav.idx+1);break;
    case 'retry':closeSheet(true);play(nav.kind,nav.idx,true);break;
    case 'tolist':closeSheet(true);renderList(nav.kind);break;
    // 密室
    case 'item':roomTapItem(b.dataset.item);break;
    case 'take':roomTake(b.dataset.obj);break;
    case 'key':lockKey(b.dataset.k);break;
    case 'bs':lockKey('⌫');break;
    case 'dial':lockDial(+b.dataset.i,+b.dataset.d);break;
    case 'lockok':lockSubmit();break;
    case 'choice':lockSubmit(b.dataset.v);break;
    case 'story':SFX.tap();storySheet();break;
    case 'roomReset':SFX.tap();openSheet(sheetHead('🔄 重新开始？')+'<p class="say">房间会回到一开始的样子，物品栏也会清空。</p><div class="actions"><button class="btn primary" data-act="roomResetYes">重新开始</button><button class="btn ghost" data-act="close">不了</button></div>');break;
    case 'roomResetYes':closeSheet(true);delete store.rooms[RP.room.id];save();startRoom(RP.i,true);break;
    // 侦探
    case 'tab':SFX.tap();setTab(b.dataset.tab);break;
    case 'clue':caseClue(b.dataset.id);break;
    case 'cell':caseCell(+b.dataset.r,+b.dataset.c);break;
    case 'rowout':CP.notes.out[b.dataset.r]=!CP.notes.out[b.dataset.r];SFX.tap();caseSave();renderNotes();break;
    case 'clearNotes':CP.notes={cells:{},out:{}};SFX.tap();caseSave();renderNotes();break;
    case 'accuse':caseAccuse(b.dataset.s);break;
    case 'reason':caseReason(+b.dataset.i);break;
    // 益智
    case 'undo':({soko:sokoUndo,hrd:hrdUndo,match:matchUndo,line:lineUndo})[nav.screen]();break;
    case 'restart':({soko:sokoRestart,hrd:hrdRestart,line:lineRestart})[nav.screen]();break;
  }
});
/* 推箱子：滑动 + 点格子；华容道：滑动 + 点木块 */
var ptr=null;
function bindSwipe(el,onSwipe,onTap){el.addEventListener('pointerdown',function(e){ptr={x:e.clientX,y:e.clientY,t:e.target};});
  el.addEventListener('pointerup',function(e){if(!ptr)return;var dx=e.clientX-ptr.x,dy=e.clientY-ptr.y,t=ptr.t;ptr=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))>22){onSwipe(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'),t);}else onTap(t,e);});
  el.addEventListener('pointercancel',function(){ptr=null;});}
bindSwipe($('#soko'),function(d){sokoDo(d);},function(t,e){var r=$('#soko').getBoundingClientRect(),cs=SP.cs,x=Math.floor((e.clientX-r.left)/cs),y=Math.floor((e.clientY-r.top)/cs);if(x<0||y<0||x>=SP.L.W||y>=SP.L.H)return;sokoTap(y*SP.L.W+x);});
bindSwipe($('#hrd'),function(d,t){var pc=t.closest&&t.closest('.pc');var k=pc?+pc.dataset.k:HP.sel;if(k===null||k===undefined||isNaN(k))return;HP.sel=k;if(E.hrd.canMove(HP.ps,k,d))hrdMove(k,d);else{SFX.bad();renderHrd();}},
  function(t){var ar=t.closest&&t.closest('.arr');if(ar){hrdMove(+ar.dataset.k,ar.dataset.dir);return;}var pc=t.closest&&t.closest('.pc');if(pc)hrdTapPiece(+pc.dataset.k);else{HP.sel=null;renderHrd();}});
document.addEventListener('keydown',function(e){var m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',w:'U',s:'D',a:'L',d:'R'};
  if(e.key==='Escape'){if(!sheetLocked)closeSheet();return;}
  if($('#mask').classList.contains('show'))return;
  if(nav.screen==='soko'&&m[e.key]){e.preventDefault();sokoDo(m[e.key]);}
  if(nav.screen==='soko'&&(e.key==='z'||e.key==='Backspace')){e.preventDefault();sokoUndo();}
  if(nav.screen==='hrd'&&m[e.key]&&HP.sel!==null){e.preventDefault();hrdMove(HP.sel,m[e.key]);}});
var rsT=null;window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){if(nav.screen==='soko'){buildSoko();renderSoko();}else if(nav.screen==='hrd')renderHrd();},120);});
/* 测试 / 调试用 */
window.PZ={E:E,store:function(){return store;},room:function(){return RP;},cas:function(){return CP;},soko:function(){return SP;},hrd:function(){return HP;},match:function(){return MP;},line:function(){return LP;},nav:nav,play:play};
paintMute();renderHome();
})();
/*UI-END*/
</script>
